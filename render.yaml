# Render blueprint for the Owner Intelligence service.
#
# One web service, built from the Dockerfile, carrying the application and the trusted evidence
# export. CSV-ONLY: no database is declared and none is required. The evidence export inside the
# image is the sole source every figure is reconstructed from.
#
# Every value marked `sync: false` is a SECRET or a deployment-specific address. Render prompts
# for it once, stores it, and never writes it into this file or the repository.

services:
  - type: web
    name: owner-intelligence
    runtime: docker
    plan: free
    region: singapore          # closest free region to the business; change if you prefer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false          # deploy when you say so, not on every push

    envVars:
      # --- identity -------------------------------------------------------------------------
      # Production posture: the bearer verifier is enforcing and AI_ANALYTICS_AUTH_DISABLE is
      # refused. Authentication is NOT switched off for this deployment.
      - key: AI_ANALYTICS_ENV
        value: production

      # The HMAC signing secret. Render generates it; it never leaves the server, and it is not
      # in this file, in the repository, or in any response.
      - key: AI_ANALYTICS_AUTH_SECRET
        generateValue: true

      # The owner opens an unlisted URL and is in: the service mints their session token itself
      # rather than asking them to paste one. Tokens are still signed, still expire, and are
      # still verified on every call -- but with this on, THE URL IS THE CREDENTIAL. Set it to
      # anything other than "true" to restore the paste-a-token screen.
      - key: AI_ANALYTICS_OWNER_OPEN
        value: "true"

      # --- evidence -------------------------------------------------------------------------
      # The trusted CSV export travels inside the image. The live Supabase source stays
      # quarantined and unconfigured: it is opt-in behind its own revalidation harness, and
      # nothing here enables it.
      - key: AI_ANALYTICS_BASE
        value: /app

      # --- persistence ----------------------------------------------------------------------
      # This deployment is CSV-only. No database is declared and none is required: every figure
      # the owner sees is reconstructed from the trusted export inside the image.
      #
      # No DATABASE_URL, no Postgres, no Supabase, no persistent disk. The owner-decision and
      # conversation stores fall back to a SQLite file inside the container, which does NOT
      # survive a deploy or a restart -- that is accepted here, not overlooked. Supply
      # DATABASE_URL later if recorded decisions ever need to outlive a deploy.

      # --- the AI Business Analyst ------------------------------------------------------------
      # DISABLED. The analyst stays on its deterministic wording: no external service is called,
      # no credential is read, and no business text leaves the machine.
      #
      # The language layer, when enabled, only re-words a finished deterministic answer -- it
      # never computes a figure, selects a definition, or overrides a posture. Enabling it needs
      # ALL of the variables below set together; any one missing leaves the analyst deterministic.
      - key: AI_ANALYTICS_LLM_ENABLE
        value: "false"
      # - key: AI_ANALYTICS_LLM_MODE
      #   value: http
      # - key: AI_ANALYTICS_LLM_ADAPTER
      #   value: groq
      # - key: GROQ_BASE_URL
      #   value: https://api.groq.com/openai/v1
      # - key: GROQ_MODEL
      #   sync: false
      # - key: GROQ_API_KEY
      #   sync: false

      # --- browser boundary -------------------------------------------------------------------
      # The frontend is served by this same service from the same origin, so no cross-origin
      # browser access is required and none is granted. Leaving this unset means no CORS
      # middleware is installed at all; a wildcard is refused outright in production.
      # - key: AI_ANALYTICS_CORS_ORIGINS
      #   value: https://owner-intelligence.onrender.com
